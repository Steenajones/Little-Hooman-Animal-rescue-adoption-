<section class="payment-section">

<h2>Select Payment Method</h2>

<div class="payment-options">

<div class="payment-option" onclick="showPayment('card')">
💳 Debit / Credit Card
</div>

<div class="payment-option" onclick="showPayment('upi')">
📱 UPI Payment
</div>

<div class="payment-option" onclick="showPayment('netbanking')">
🏦 Net Banking
</div>

</div>

<!-- CARD PAYMENT FORM -->
<div id="card" class="payment-form">

<h3>Card Details</h3>

<input type="text" placeholder="Cardholder Name" required>

<input type="text" placeholder="Card Number" required>

<input type="text" placeholder="Expiry Date (MM/YY)" required>

<input type="text" placeholder="CVV" required>

<button class="btn">Pay Now</button>

</div>

<!-- UPI PAYMENT FORM -->
<div id="upi" class="payment-form">

<h3>UPI Payment</h3>

<input type="text" placeholder="Enter UPI ID (example@upi)" required>

<button class="btn">Pay Now</button>

</div>

<!-- NET BANKING FORM -->
<div id="netbanking" class="payment-form">

<h3>Net Banking</h3>

<select>

<option>Select Bank</option>
<option>SBI</option>
<option>HDFC</option>
<option>ICICI</option>
<option>Axis Bank</option>

</select>

<input type="text" placeholder="User ID">

<input type="password" placeholder="Password">

<button class="btn">Pay Now</button>

</div>

</section>
