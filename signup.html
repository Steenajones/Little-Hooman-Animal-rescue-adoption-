<section class="auth-section">

<h2 id="form-title">Sign In</h2>

<!-- ✅ FIXED FORM -->
<form class="auth-box" id="authForm">

<input type="text" id="name" placeholder="Full Name" style="display:none;">

<input type="email" id="email" placeholder="Email" required>

<div class="password-field">
  <input type="password" id="password" placeholder="Password" required>
  <button type="button" class="toggle-password-inline" onclick="togglePassword()">Show</button>
</div>

<button type="submit" class="btn" id="submitBtn">Login</button>

<p>
Don't have an account?
<span class="toggle-link" onclick="toggleForm()">Register</span>
</p>

</form>
